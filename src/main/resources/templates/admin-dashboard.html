<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Espace Administrateur</title>
</head>
<body>
<h2>Espace Administrateur</h2>
<p>Section réservée aux utilisateurs ayant le rôle ADMIN.</p>

<!-- La déconnexion doit se faire en POST (protection CSRF de Spring Security) -->
<!-- 注销必须使用 POST 请求（Spring Security 的 CSRF 保护） -->
<form th:action="@{/logout}" method="post">
    <button type="submit">Déconnexion</button>
</form>
</body>
</html>
